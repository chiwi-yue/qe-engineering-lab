services:
  db:
    image: postgres:17.6
    environment:
      POSTGRES_USER: qe
      POSTGRES_PASSWORD: qe_local_only
      POSTGRES_DB: qe_lab
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U qe -d qe_lab']
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
