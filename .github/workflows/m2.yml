name: M2 quality checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: qe
          POSTGRES_PASSWORD: qe_ci_ephemeral
          POSTGRES_DB: qe_lab_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U qe -d qe_lab_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://qe:qe_ci_ephemeral@127.0.0.1:5432/qe_lab_test
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm lint && pnpm format:check && pnpm typecheck && pnpm test && pnpm build
      - run: pnpm test:db:migrate
      - run: pnpm test:ui
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-diagnostics
          path: |
            playwright-report/
            test-results/
          retention-days: 7
